<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | Kami's Gamified English Resources</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="container">
        <h1>Kami's Gamified English Resources</h1>
        <p>Interactive Kahoot and Wordwall activities for engaging English lessons.</p>

        <nav class="main-nav">
          <a href="/index.html">Home</a>
          <a href="/resources.html">Resources</a>
          <a href="/index.html#libraries">Libraries</a>
          <a href="/how-to-use.html">How to Use</a>
          <a href="/index.html#about">About</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="login-section auth-card reset-card">
        <h2>Reset Password</h2>
        <p>Choose a new password for your account.</p>

        <form id="reset-password-form">
          <label for="new-password">New Password</label>

          <div class="password-wrapper">
            <input
              type="password"
              id="new-password"
              name="new-password"
              autocomplete="new-password"
              minlength="8"
              required
            />

            <button
              type="button"
              id="toggle-new-password"
              class="password-toggle password-hidden"
              aria-label="Show password"
            >
              &#128065;
            </button>
          </div>

          <p class="password-hint">
            Use at least 8 characters. A longer, unique password is safer.
          </p>

          <label for="confirm-new-password">Confirm New Password</label>

          <div class="password-wrapper">
            <input
              type="password"
              id="confirm-new-password"
              name="confirm-new-password"
              autocomplete="new-password"
              minlength="8"
              required
            />

            <button
              type="button"
              id="toggle-confirm-new-password"
              class="password-toggle password-hidden"
              aria-label="Show password"
            >
              &#128065;
            </button>
          </div>

          <button type="submit">Save New Password</button>
          <p id="reset-message" class="form-message" aria-live="polite"></p>
        </form>

        <p class="auth-switch">
          <a href="/login.html">Back to Sign In</a>
        </p>
      </section>
    </main>

    <script type="module" src="/src/reset-password.js"></script>
    <script type="module" src="/src/auth-nav.js"></script>
  </body>
</html>
